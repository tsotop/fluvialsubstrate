# Substrate Classification Configuration

# Paths
paths:
  orthophoto: "data/Brenta/orthophoto.tif"
  labels_gpkg: "sampling_data.gpkg"
  labels_layer: "annotations"
  output_dir: "outputs"
  models_dir: "outputs/models"
  features_dir: "outputs/features"
  maps_dir: "outputs/maps"
  validation_dir: "outputs/validation"

# Feature Extraction
features:
  block_size: 50
  tile_size: 300
  min_label_coverage: 0.9
  feature_families: [spectral, glcm, lbp, glcm_ms, lbp_ms, gradient]
  n_jobs: -1

# Modeling
model:
  type: "RandomForest" # Options: RandomForest, XGBoost, LightGBM
  class_weighting: capped
  weight_cap: 10.0
  per_polygon_weighting: false
  selection_rule: mean
  pfi_scoring: balanced_accuracy
  corr_threshold: 0.9
  final_feature_count: null
  nested_cv: true
  random_cv: true
  random_seed: 42

# Validation
validation:
  total_samples: 150
  min_samples_per_class: 20
  confidence_level: 0.95

# Map post-processing
postprocess:
  smoothing: 1
  fill_min_valid: 0.5
  write_probabilities: false

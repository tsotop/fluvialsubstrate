# Conda environment (Windows, macOS, Linux):
#   conda env create -f environment.yml
#   conda activate fluvialsubstrate
name: fluvialsubstrate
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  - scikit-image>=0.21
  - rasterio>=1.3
  - geopandas>=1.0
  - shapely>=2.0
  - fiona>=1.9
  - matplotlib>=3.7
  - joblib
  - tqdm
  - pyyaml
  - jupyterlab
  - ipykernel
